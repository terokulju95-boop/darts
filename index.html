<script>
// ======= BACKGROUND: dartboard ghost + floating particles =======
(function(){
  const canvas = document.getElementById('bg-canvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // Board position - right side, partially visible
  const BX = () => W * 0.82;
  const BY = () => H * 0.40;
  const BR = () => Math.min(W, H) * 0.38;

  // Dartboard colors (ghost, very low alpha)
  const ORDER = [20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];

  function drawBoard() {
    const bx=BX(), by=BY(), br=BR();
    ctx.save();
    // Overall fade
    ctx.globalAlpha = 0.13;

    // Segments
    for(let i=0;i<20;i++){
      const a1 = (i*18-99)*Math.PI/180;
      const a2 = ((i+1)*18-99)*Math.PI/180;
      const even = i%2===0;
      // doubles
      ctx.beginPath(); ctx.moveTo(bx,by);
      ctx.arc(bx,by,br*0.955,a1,a2);
      ctx.arc(bx,by,br*0.855,a2,a1,true);
      ctx.closePath();
      ctx.fillStyle = even?'#cc0022':'#009933'; ctx.fill();
      // large score
      ctx.beginPath(); ctx.moveTo(bx,by);
      ctx.arc(bx,by,br*0.855,a1,a2);
      ctx.arc(bx,by,br*0.54,a2,a1,true);
      ctx.closePath();
      ctx.fillStyle = even?'#111':'#ccc'; ctx.fill();
      // triples
      ctx.beginPath(); ctx.moveTo(bx,by);
      ctx.arc(bx,by,br*0.54,a1,a2);
      ctx.arc(bx,by,br*0.47,a2,a1,true);
      ctx.closePath();
      ctx.fillStyle = even?'#cc0022':'#009933'; ctx.fill();
      // inner score
      ctx.beginPath(); ctx.moveTo(bx,by);
      ctx.arc(bx,by,br*0.47,a1,a2);
      ctx.arc(bx,by,br*0.162,a2,a1,true);
      ctx.closePath();
      ctx.fillStyle = even?'#111':'#ccc'; ctx.fill();
    }
    // bull outer
    ctx.beginPath(); ctx.arc(bx,by,br*0.162,0,Math.PI*2);
    ctx.fillStyle='#009933'; ctx.fill();
    // bullseye
    ctx.beginPath(); ctx.arc(bx,by,br*0.08,0,Math.PI*2);
    ctx.fillStyle='#cc0022'; ctx.fill();
    // wire rings
    ctx.globalAlpha=0.08;
    [0.162,0.47,0.54,0.855,0.955].forEach(r=>{
      ctx.beginPath(); ctx.arc(bx,by,br*r,0,Math.PI*2);
      ctx.strokeStyle='#aaa'; ctx.lineWidth=1.5; ctx.stroke();
    });
    ctx.restore();
  }

  // Slow pulse animation on board
  let pulse = 0;

  // Particles
  function mkParticle() {
    return {
      x: Math.random()*W, y: Math.random()*H,
      vx: (Math.random()-0.5)*0.3,
      vy: -0.2-Math.random()*0.4,
      r: 1+Math.random()*2,
      alpha: 0.05+Math.random()*0.12,
      life: 0, maxLife: 200+Math.random()*300,
      color: Math.random()>0.7?'#00e87a':'#ffffff'
    };
  }
  for(let i=0;i<40;i++) { const p=mkParticle(); p.life=Math.random()*p.maxLife; particles.push(p); }

  function drawParticles() {
    particles.forEach(p => {
      const fade = Math.sin(p.life/p.maxLife*Math.PI);
      ctx.save();
      ctx.globalAlpha = p.alpha * fade;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = p.color;
      ctx.fill();
      ctx.restore();
      p.x += p.vx; p.y += p.vy; p.life++;
      if(p.life >= p.maxLife) { Object.assign(p, mkParticle()); p.life=0; }
    });
  }

  let boardRotation = 0;

  function frame() {
    ctx.clearRect(0,0,W,H);
    pulse += 0.008;
    boardRotation += 0.0008; // very slow rotation ~2min per full turn
    // Subtle pulsing glow behind board
    const bx=BX(),by=BY(),br=BR();
    const grd = ctx.createRadialGradient(bx,by,br*0.3,bx,by,br*1.1);
    const gAlpha = 0.04+Math.sin(pulse)*0.015;
    grd.addColorStop(0,`rgba(0,232,122,${gAlpha})`);
    grd.addColorStop(1,'rgba(0,232,122,0)');
    ctx.fillStyle=grd; ctx.fillRect(0,0,W,H);
    // Draw board with rotation
    ctx.save();
    ctx.translate(bx, by);
    ctx.rotate(boardRotation);
    ctx.translate(-bx, -by);
    drawBoard();
    ctx.restore();
    drawParticles();
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
